# A push to main whose version has no tag yet builds the signed APKs and the
# Arch package and publishes them as release v<version> (tools/release.sh
# sets the version). Secrets: ANDROID_KEYSTORE (the release keystore,
# base64) and ANDROID_KEYSTORE_PASSWORD.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          cargo_version() { sed -n 's/^version = "\(.*\)"/\1/p' "$1" | head -1; }
          version=$(cargo_version crates/android-app/Cargo.toml)
          manifest=crates/android-app/AndroidManifest.xml
          name=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' "$manifest")
          code=$(sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' "$manifest")
          IFS=. read -r major minor patch <<< "$version"
          for other in "$(cargo_version crates/linux/Cargo.toml)" \
              "$(sed -n 's/^pkgver=//p' PKGBUILD)" "$name"; do
            [ "$other" = "$version" ] || { echo "::error::version $other isn't $version (tools/release.sh)"; exit 1; }
          done
          [ "$code" = $(( (1 << 24) + (major << 16) + (minor << 8) + patch )) ] ||
            { echo "::error::versionCode $code doesn't match $version (tools/release.sh)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
      - run: cargo install cargo-apk2 --version 1.4.2 --locked
      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::no ANDROID_KEYSTORE secret"; exit 1; }
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          base64 -d <<< "$KEYSTORE" > "$CARGO_APK_RELEASE_KEYSTORE"
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          cargo apk2 build -p android-app --release
          cargo xposed
          version=${{ needs.version.outputs.version }}
          mkdir out
          cp target/release/apk/calvados.apk "out/calvados-$version.apk"
          cp target/release/calvados-xposed.apk "out/calvados-xposed-$version.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  arch:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust clang bluez dbus libpipewire libcap
      - uses: actions/checkout@v4
      - name: Build
        run: |
          useradd -m builder
          chown -R builder: .
          sudo -u builder makepkg --noconfirm
          mkdir out && cp ./*.pkg.tar.zst out/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/

  release:
    needs: [version, android, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.version.outputs.version }}
          gh release create "v$version" out/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Calvados $version" --generate-notes
