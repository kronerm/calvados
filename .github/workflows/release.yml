# Builds the signed APKs and the Arch package and publishes them:
# - a tag v0.1.1 as release 0.1.1, a tag v0.1.1-alpha.2 as pre-release
#   0.1.1alpha2;
# - every push to main as the rolling pre-release "testing" (version like
#   0.1.1.r3.g1a2b3c4).
# The version comes from the tags (tools/version.sh), the same for pacman
# and Android, so updates go release < testing < next alpha < next release.
#
# Secrets: ANDROID_KEYSTORE (the release keystore, base64) and
# ANDROID_KEYSTORE_PASSWORD, seen only by the signing step, which runs
# apksigner and nothing else: the build (dependencies' build scripts
# included) signs with a throwaway key. Only the release job may write to
# the repo. Actions are GitHub's own, pinned by commit; the SDK, NDK and
# JDK are the runner's.
name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: version
        run: |
          read -r version code < <(tools/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::version $version, versionCode $code"

  android:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: SDK, NDK, JDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      # Cargo's downloads, the build and cargo-apk2: dependencies rebuild
      # only when Cargo.lock or the compiler changes, and then from the
      # newest older cache.
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-apk2
            target
          key: android-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-${{ steps.rust.outputs.version }}-
      - run: command -v cargo-apk2 || cargo install cargo-apk2 --version 1.4.2 --locked
      - name: Build
        env:
          CODE: ${{ needs.version.outputs.code }}
        run: |
          # cargo-apk2 won't build a release unsigned: a throwaway key.
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/build.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=throwaway
          keytool -genkeypair -storetype PKCS12 -keystore "$CARGO_APK_RELEASE_KEYSTORE" \
            -alias build -keyalg EC -groupname secp256r1 -validity 1 \
            -storepass throwaway -keypass throwaway -dname CN=build
          sed -i "s/android:versionCode=\"[0-9]*\"/android:versionCode=\"$CODE\"/; s/android:versionName=\"[^\"]*\"/android:versionName=\"$VERSION\"/" \
            crates/android-app/AndroidManifest.xml
          cargo apk2 build -p android-app --release
          cargo xposed
          mkdir out
          cp target/release/apk/calvados.apk "out/calvados-$VERSION.apk"
          cp target/release/calvados-xposed.apk "out/calvados-xposed-$VERSION.apk"
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::no ANDROID_KEYSTORE secret"; exit 1; }
          keystore="$RUNNER_TEMP/release.keystore"
          base64 -d <<< "$KEYSTORE" > "$keystore"
          for apk in out/*.apk; do
            apksigner sign --ks "$keystore" --ks-pass env:PASSWORD --key-pass env:PASSWORD "$apk"
            apksigner verify --print-certs "$apk" | grep 'SHA-256'
          done
          rm "$keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: out/

  arch:
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust clang bluez dbus libpipewire libcap
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: rust
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The build user's Cargo downloads and the PKGBUILD's target dir.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            src/target
          key: arch-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-${{ steps.rust.outputs.version }}-
      - name: Build
        run: |
          useradd -m builder
          chown -R builder: . /home/builder
          sudo -u builder git config --global --add safe.directory "$PWD"
          sudo -u builder makepkg --noconfirm
          mkdir out && cp ./*.pkg.tar.zst out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch
          path: out/

  release:
    needs: [version, android, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          repo=(--repo "$GITHUB_REPOSITORY")
          case "$GITHUB_REF" in
            refs/tags/*)
              tag=${GITHUB_REF#refs/tags/}
              flags=(--title "Calvados $VERSION" --generate-notes)
              case $tag in *-alpha.*) flags+=(--prerelease) ;; esac
              gh release create "$tag" out/* "${repo[@]}" "${flags[@]}"
              ;;
            *)
              # One rolling testing release, moved to this commit.
              gh release delete testing --cleanup-tag --yes "${repo[@]}" 2>/dev/null || true
              gh release create testing out/* "${repo[@]}" --target "$GITHUB_SHA" \
                --prerelease --title "Testing $VERSION" \
                --notes "Built from $GITHUB_SHA on main; newer than the last release, older than the next."
              ;;
          esac
