[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
authors = ["Martin Kröner <calvados@kroner.dev>"]
license = "MIT"
edition = "2024"
rust-version = "1.93.1"
publish = false

[profile.release]
lto = true

[profile.release.package.android-hook]
opt-level = "z"
codegen-units = 1
strip = true
