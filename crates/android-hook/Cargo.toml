[package]
name = "android-hook"
description = "Native hook library for Calvados Xposed module"
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Loaded by path in the system Bluetooth process: keep it distinctive.
name = "calvados_hook"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
anyhow = "1"
libc = "0.2"
lzma-rust2 = { version = "0.20", default-features = false, features = [
  "std",
  "xz",
] }
object = "0.40"
paranoid-android = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
