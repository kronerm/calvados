[package]
name = "firmware-fetch"
description = "Apple's firmware catalog and the release's package, for both platforms"
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
protocol = { path = "../protocol", features = ["catalog"] }
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The firmware asset; pure Rust inflate.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
