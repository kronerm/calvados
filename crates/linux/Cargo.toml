[package]
name = "linux"
description = "Linux service"
version = "0.1.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "calvados"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bluer = { version = "0.17", features = ["full"] }
firmware-fetch = { path = "../firmware-fetch" }
protocol = { path = "../protocol" }
tokio = { version = "1.53", features = ["full", "signal"] }
tracing = "0.1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
hex = "0.4"
serde_json = "1"
libc = "0.2"
pipewire = "0.10"
